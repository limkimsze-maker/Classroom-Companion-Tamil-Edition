<!doctype html>
<html lang="ta-SG">

<title>வகுப்பறை உதவியாளரைத் திற</title>
<style>
:root{--teal:#0f766e;--teal2:#dff6f1;--navy:#17324d;--muted:#667085;--line:#d8e1e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eff8f6,#f7f9fc 55%,#edf3f8);font-family:"Noto Sans Tamil","Nirmala UI",Latha,Inter,system-ui,sans-serif;color:#17202a;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 52px rgba(18,32,46,.13);text-align:center}.logo{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:var(--teal2);color:var(--teal);font-size:28px;font-weight:1000;margin:0 auto 13px}h1{margin:0;color:var(--navy);font-size:24px}.sub{margin:7px 0 18px;color:var(--muted);font-size:13px;line-height:1.45;font-weight:750}.open{width:100%;min-height:58px;border:0;border-radius:16px;background:linear-gradient(145deg,#0f766e,#0b5f59);color:#fff;font-size:17px;font-weight:1000;cursor:pointer;box-shadow:0 10px 24px rgba(15,118,110,.22)}.note{margin-top:13px;color:#667085;font-size:11px;line-height:1.4;font-weight:750}.langs{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:16px}.langs a{padding:6px 9px;border:1px solid #cfe0de;border-radius:10px;background:#f7fbfa;color:#0f5f59;text-decoration:none;font-size:11px;font-weight:950}.langs a.active{background:#0f766e;color:#fff;border-color:#0f766e}
</style>
</head>
<body>
<main class="card"><div class="logo">✦</div><h1>வகுப்பறை உதவியாளர்</h1><div class="sub">16 ஆசிரியர் கருவிகளைக் கொண்ட பட்டையைத் திறக்கவும்.</div><button class="open" id="openBtn" type="button">வகுப்பறை உதவியாளர் பட்டையைத் திற</button><div class="note" id="note">Chrome புதிய தாவலிலிருந்து இந்தப் பக்கம் திறந்திருந்தாலும் பயன்படுத்தலாம்.</div><div class="langs"><a href="/Classroom-Companion/open-strip.html">English</a><a href="/Classroom-Companion-Chinese-Edition/open-strip.html">中文</a><a href="/Classroom-Companion-Malay-Edition/open-strip.html">Bahasa Melayu</a><a class="active" href="open-strip.html">தமிழ்</a></div></main>
<script>
'use strict';
const toolbarUrl=new URL('widget-launch.html',location.href).href;
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||matchMedia('(max-width:700px)').matches||matchMedia('(pointer:coarse)').matches;
function features(){const sh=screen.availHeight||800,w=470,h=Math.min(780,Math.max(620,sh-40)),l=(screen.availLeft||0)+8,t=(screen.availTop||0)+8;return `popup=yes,width=${w},height=${h},left=${l},top=${t},resizable=yes,scrollbars=no,toolbar=no,location=no,menubar=no,status=no`}
function openStrip(){if(isMobile){location.href=toolbarUrl+'?v='+Date.now();return}let x=null;try{x=window.open(toolbarUrl+'?v='+Date.now(),'ClassroomCompanionTamilStrip',features())}catch(e){}if(!x){document.getElementById('note').textContent='Pop-up சாளரங்களை அனுமதித்து மீண்டும் முயற்சிக்கவும்.';return}try{x.focus()}catch(e){}}
document.getElementById('openBtn').addEventListener('click',openStrip);
</script>
</body>
</html>

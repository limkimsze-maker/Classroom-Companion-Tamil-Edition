<!doctype html>
<html lang="ta-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>வகுப்பறை உதவியாளர் • தமிழ் பதிப்பு</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="sourceFrame" title="வகுப்பறை உதவியாளர்" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script src="tamil-translate.js?v=20261005ta1"></script>
<script>
'use strict';
const p=new URLSearchParams(location.search),tool=p.get('tool')||'timer-calm-music',display=p.get('display')||'';
const frame=document.getElementById('sourceFrame');
function addTamilTeacherNote(){
  if(tool!=='quote-of-the-day')return;
  try{
    const d=frame.contentDocument;
    if(!d||d.getElementById('tamilTeacherQuoteNote'))return;
    const panel=d.getElementById('panel');
    if(!panel)return;
    const note=d.createElement('div');
    note.id='tamilTeacherQuoteNote';
    note.textContent='குறிப்பு: துல்லியமான, பொருத்தமான தமிழ் மொழிநடைக்காக ஊக்கவுரைகளை ஆசிரியர்கள் தாங்களே உள்ளிட்டு, தேவையெனில் திருத்தலாம்.';
    note.style.cssText='max-width:900px;margin:14px auto 0;padding:8px 12px;border:1px solid #cfe0de;border-radius:12px;background:#f7fbfa;color:#365b56;font-family:"Noto Sans Tamil","Nirmala UI",Latha,Inter,system-ui,sans-serif;font-size:11px;font-weight:800;line-height:1.4;text-align:center;';
    panel.appendChild(note);
  }catch(e){}
}
frame.src='/Classroom-Companion/support-tool.html?tool='+encodeURIComponent(tool)+(display?'&display='+encodeURIComponent(display):'')+'&v='+Date.now();
frame.addEventListener('load',()=>{
  window.CCTamil?.attach(frame,{tool});
  setTimeout(addTamilTeacherNote,180);
  setTimeout(addTamilTeacherNote,800);
  if(display==='fullscreen'){
    try{
      const d=frame.contentDocument,s=d.createElement('script');
      s.src='/Classroom-Companion/fullscreen-tool-layout.js?v=20261006full1';
      d.body.appendChild(s);
    }catch(e){}
  }
});
</script>
</body>
</html>

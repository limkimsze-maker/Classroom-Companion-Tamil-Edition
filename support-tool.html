<!doctype html>
<html lang="ta-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>வகுப்பறை உதவியாளர் • தமிழ் பதிப்பு</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#fff}</style>
</head>
<body>
<iframe id="sourceFrame" title="வகுப்பறை உதவியாளர்" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script src="tamil-translate.js?v=20261005ta1"></script>
<script>
'use strict';
const p=new URLSearchParams(location.search),tool=p.get('tool')||'timer-calm-music',display=p.get('display')||'';
const frame=document.getElementById('sourceFrame');
let quoteNoteObserver=null;
function addTamilTeacherNote(){
  if(tool!=='quote-of-the-day')return;
  try{
    const d=frame.contentDocument;
    if(!d)return;
    const panel=d.getElementById('panel');
    if(!panel)return;
    if(!d.getElementById('tamilTeacherQuoteDetails')){
      const support=panel.querySelector('.supportText');
      const details=d.createElement('details');
      details.id='tamilTeacherQuoteDetails';
      details.style.cssText='max-width:760px;margin:8px auto 12px;text-align:center;font-family:"Noto Sans Tamil","Nirmala UI",Latha,Inter,system-ui,sans-serif;color:#365b56;';
      const summary=d.createElement('summary');
      summary.textContent='ℹ️ ஆசிரியர் குறிப்பு';
      summary.style.cssText='display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:6px 11px;border:1px solid #cfe0de;border-radius:999px;background:#f7fbfa;color:#365b56;font-size:12px;font-weight:900;line-height:1.2;cursor:pointer;list-style:none;user-select:none;';
      const note=d.createElement('div');
      note.textContent='துல்லியமான, பொருத்தமான தமிழ் மொழிநடைக்காக ஊக்கவுரைகளை ஆசிரியர்கள் தாங்களே உள்ளிட்டு, தேவையெனில் திருத்தலாம்.';
      note.style.cssText='margin:7px auto 0;padding:8px 11px;border:1px solid #dbe8e5;border-radius:11px;background:#fbfdfc;color:#526f6b;font-size:11px;font-weight:800;line-height:1.45;text-align:center;';
      details.append(summary,note);
      if(support)support.insertAdjacentElement('afterend',details);else panel.appendChild(details);
    }
    if(!quoteNoteObserver){
      quoteNoteObserver=new MutationObserver(()=>{
        if(!d.getElementById('tamilTeacherQuoteDetails'))setTimeout(addTamilTeacherNote,0);
      });
      quoteNoteObserver.observe(panel,{childList:true});
    }
  }catch(e){}
}
frame.src='/Classroom-Companion/support-tool.html?tool='+encodeURIComponent(tool)+(display?'&display='+encodeURIComponent(display):'')+'&v='+Date.now();
frame.addEventListener('load',()=>{
  window.CCTamil?.attach(frame,{tool});
  setTimeout(addTamilTeacherNote,120);
  setTimeout(addTamilTeacherNote,500);
  setTimeout(addTamilTeacherNote,1200);
  if(display==='fullscreen'){
    try{
      const d=frame.contentDocument,s=d.createElement('script');
      s.src='/Classroom-Companion/fullscreen-tool-layout.js?v=20261006full1';
      d.body.appendChild(s);
    }catch(e){}
  }
});
</script>
</body>
</html>
